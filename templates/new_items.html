<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ערים חדשות</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename=logo | default('images/logo.png')) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
{% extends "base.html" %}
{% block content %}

<style>
    .page-wrapper { max-width: 1000px; margin: 40px auto; font-family: 'Rubik', sans-serif; direction: rtl; }

    .control-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

    .input-group { display: flex; gap: 15px; align-items: flex-end; margin-bottom: 30px; border-bottom: 2px solid #f8f9fa; padding-bottom: 20px; }

    .input-field { display: flex; flex-direction: column; gap: 8px; font-family: 'Rubik', sans-serif; }
    .input-field label { font-size: 14px; color: #666; font-weight: 500; font-family: 'Rubik', sans-serif; }

    .styled-input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; transition: border 0.3s; font-family: 'Rubik', sans-serif; }
    .styled-input:focus { border-color: #2575fc; outline: none; }

    .add-btn { font-family: 'Rubik', sans-serif; background: #2575fc; color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
    .add-btn:hover { background: #1a5ecf; }

    .data-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
    .data-table th { color: #888; font-weight: 400; padding: 15px; }
    .data-table td { background: #fdfdfd; padding: 20px; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
    .data-table tr td:first-child { border-right: 1px solid #eee; border-radius: 10px 0 0 10px; font-weight: bold; width: 10%; }
    .data-table tr td:last-child { border-left: 1px solid #eee; border-radius: 0 10px 10px 0; }

    .modal-content {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

        /* הגדרת הפונט והבסיס לכפתורים */
    .btn-create, .btn-cancel {
        font-family: 'Rubik', sans-serif;
        padding: 10px 24px;
        border-radius: 12px;
        border: none;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.25s ease; /* אנימציה חלקה לכל השינויים */
        outline: none;
    }

    /* כפתור מחיקה (אדום) */
    .btn-create {
        background-color: #ef4444; /* אדום מודרני */
        color: white;
        box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
    }

    .btn-create:hover {
        background-color: #dc2626; /* אדום כהה יותר בסימון */
        transform: translateY(-2px); /* קפיצה קטנה למעלה */
        box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
    }

    .btn-create:active {
        transform: translateY(0); /* לחיצה מחזירה למקום */
    }

    /* כפתור ביטול (אפור) */
    .btn-cancel {
        background-color: #f3f4f6; /* אפור בהיר מאוד */
        color: #4b5563; /* טקסט אפור כהה */
    }

    .btn-cancel:hover {
        background-color: #e5e7eb; /* אפור מעט כהה יותר */
        color: #1f2937;
        transform: translateY(-2px);
    }

    .btn-cancel:active {
        transform: translateY(0);
    }

</style>

<div class="page-wrapper">
    <h2 style="font-size: 32px; color: #333; margin-bottom: 20px;">ניהול ערים וקודים</h2>

    <div class="control-card" style="overflow-y: auto; max-height: 450px">
        <div class="input-group">
            <div class="input-field">
                <label>בחר עיר</label>
                <select id="citySelect" class="styled-input">
                    <option value="" disabled selected style="font-family: 'Rubik', sans-serif;">בחר עיר...</option>
                    {% for c in cities %}
                        <option value="{{ c.title }}" style="font-family: 'Rubik', sans-serif;">{{ c.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="input-field">
                <label>הכנס קוד</label>
                <input type="text" id="codeInput" class="styled-input" placeholder="לדוגמה: A123">
            </div>
            <button onclick="addEntry()" class="add-btn">הוסף קוד</button>
            <button onclick="manualValidationCheck()" class="add-btn">
                בדוק זמינות
            </button>
        </div>

        <table class="data-table" id="summaryTable">
            <thead>
                <tr>
                    <th style="text-align: right;">עיר</th>
                    <th style="text-align: right;">קודים פעילים</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="deleteConfirmModal" class="modal" style="display: none; z-index: 2000;">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2 style="color: #e74c3c;">אישור מחיקה</h2>
            <p>האם אתה בטוח שברצונך למחוק את הקוד:</p>
            <p id="delete-user-display-name" style="font-weight: bold; font-size: 20px; margin: 15px 0;"></p>
            <br>
            <div class="button-group" style="display: flex; justify-content: center; gap: 10px;">
                <button type="button" id="confirmDeleteBtn" class="btn-create">מחק</button>
                <button type="button" onclick="closeDeleteModal()" class="btn-cancel">ביטול</button>
            </div>
        </div>
    </div>

    <div id="search-check-modal" class="modal" style="display:none; position:fixed; z-index:5000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; backdrop-filter: blur(5px);">

        <div style="background:white; padding:35px; border-radius:24px; width:400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); direction: rtl; font-family: 'Rubik'; position: relative;">

            <span class="close-btn" onclick="closeSearchModal()">&times;</span>

            <h2 style="margin: 0 0 10px 0; color: #2575fc; text-align: center; font-size: 1.6em;">בדיקת נתונים</h2>
            <p style="color:#777; font-size: 0.9em; text-align: center; margin-bottom: 25px;">בחר סוג חיפוש והזן את הנתון לבדיקה</p>

            <div style="display: flex; justify-content: center; margin-bottom: 30px;">
                <div style="display: flex; background: #f1f3f5; padding: 4px; border-radius: 14px; width: 100%; position: relative; cursor: pointer; user-select: none;" onclick="toggleSearchType()">
                    <div id="switch-bg" style="position: absolute; width: calc(50% - 4px); height: calc(100% - 8px); background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(0);"></div>

                    <div id="label-city" style="flex: 1; text-align: center; padding: 10px; font-weight: bold; position: relative; z-index: 1; transition: color 0.3s; color: #2575fc;">עיר</div>
                    <div id="label-code" style="flex: 1; text-align: center; padding: 10px; font-weight: bold; position: relative; z-index: 1; transition: color 0.3s; color: #495057;">קוד</div>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div id="city-field-wrapper">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">שם עיר לבדיקה</label>
                    <input type="text" id="checkCityInput" placeholder="למשל: תל אביב" style="width:100%; padding:12px; border:1.5px solid #eee; border-radius:12px; font-family: 'Rubik'; box-sizing: border-box; outline: none;">
                </div>

                <div id="code-field-wrapper" style="display: none;">
                    <label style="display: block; font-weight: bold; margin-bottom: 8px; color: #333;">קוד לבדיקה</label>
                    <input type="text" id="checkCodeInput" placeholder="למשל: A123" style="width:100%; padding:12px; border:1.5px solid #eee; border-radius:12px; font-family: 'Rubik'; box-sizing: border-box; outline: none;">
                </div>

                <div id="check-result-area" style="padding: 15px; border-radius: 12px; display: none; font-weight: bold; text-align: center; font-size: 0.95em;"></div>

                <div style="display: flex; gap: 12px; margin-top: 10px;">
                    <button onclick="executeDbCheck()" style="background: #2575fc; color: white; border: none; padding: 14px; border-radius: 12px; flex: 2; cursor: pointer; font-weight: bold; font-family: 'Rubik';">בצע בדיקה</button>
                    <button onclick="closeSearchModal()" style="background: #f8f9fa; color: #495057; border: none; padding: 14px; border-radius: 12px; flex: 1; cursor: pointer; font-family: 'Rubik';">ביטול</button>
                </div>
            </div>
        </div>
    </div>
<script>
    let currentSearchType = 'city'; // ברירת מחדל

    function toggleSearchType() {
        const cityWrapper = document.getElementById('city-field-wrapper');
        const codeWrapper = document.getElementById('code-field-wrapper');
        const switchBg = document.getElementById('switch-bg');
        const labelCity = document.getElementById('label-city');
        const labelCode = document.getElementById('label-code');
        const resultArea = document.getElementById('check-result-area');

        // איפוס תוצאות קודמות
        resultArea.style.display = 'none';

        if (currentSearchType === 'city') {
            // מעבר לקוד
            currentSearchType = 'code';
            cityWrapper.style.display = 'none';
            codeWrapper.style.display = 'block';

            // אנימציית המתג
            switchBg.style.transform = 'translateX(-100%)'; // מזיז שמאלה (לכיוון הקוד)
            labelCode.style.color = '#2575fc';
            labelCity.style.color = '#495057';
        } else {
            // מעבר לעיר
            currentSearchType = 'city';
            cityWrapper.style.display = 'block';
            codeWrapper.style.display = 'none';

            // אנימציית המתג
            switchBg.style.transform = 'translateX(0)'; // חוזר לימין
            labelCity.style.color = '#2575fc';
            labelCode.style.color = '#495057';
        }
    }

    // 1. פתיחת המודל הריק
    function manualValidationCheck() {
        // איפוס שדות ושטח תוצאה לפני הפתיחה
        document.getElementById('checkCityInput').value = '';
        document.getElementById('checkCodeInput').value = '';
        const resultArea = document.getElementById('check-result-area');
        resultArea.style.display = 'none';

        document.getElementById('search-check-modal').style.display = 'flex';
    }

    // 2. סגירת המודל
    function closeSearchModal() {
        document.getElementById('search-check-modal').style.display = 'none';
    }

    async function executeDbCheck() {
        const city = document.getElementById('checkCityInput').value.trim();
        const code = document.getElementById('checkCodeInput').value.trim();
        const resultArea = document.getElementById('check-result-area');

        const payload = {
            city_name: currentSearchType === 'city' ? city : "",
            code: currentSearchType === 'code' ? code : ""
        };

        if ((currentSearchType === 'city' && !city) || (currentSearchType === 'code' && !code)) {
            resultArea.style.display = 'block';
            resultArea.style.background = '#fff3cd';
            resultArea.style.color = '#856404';
             resultArea.style.border = '1px solid #ffecb3';
            resultArea.innerText = "נא להזין ערך לבדיקה";
            return;
        }

        try {
            const response = await fetch('/check_availability', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();

            resultArea.style.display = 'block';

            if ((currentSearchType === 'city' && data.city_exists) || (currentSearchType === 'code' && data.code_exists)) {
                resultArea.style.background = '#fff5f5';
                resultArea.style.color = '#c92a2a';
                resultArea.style.border = '1px solid #ffc9c9';
                resultArea.innerText = data.city_exists ?
                    `העיר "${city}" כבר קיימת במערכת.` :
                    `הקוד "${code}" תפוס בעיר ${data.existing_city}.`;
            } else {
                resultArea.style.background = '#ebfbee';
                resultArea.style.color = '#2b8a3e';
                resultArea.style.border = '1px solid #b2f2bb';
                resultArea.innerText = "✅ הנתון פנוי לשימוש!";
            }
        } catch (e) {
            resultArea.style.display = 'block';
            resultArea.style.background = '#f8d7da';
            resultArea.innerText = "שגיאת תקשורת עם השרת";
        }
    }

    let pendingDeleteAction = null; // משתנה לשמירת הפעולה שצריך לבצע

        // פונקציה שמציגה את הדיאלוג ושומרת את הקריאה לשרת ללחיצה על "אישור"
    function removeCode(city, codeToRemove) {
        const modal = document.getElementById('deleteConfirmModal');
        modal.style.display = 'flex'; // מציג את הדיאלוג

        // הגדרת פעולת האישור - אנו מעדכנים את הכפתור בתוך הדיאלוג
        const confirmBtn = document.getElementById('confirmDeleteBtn');

        // מנקים קליקים קודמים כדי למנוע כפילויות
        confirmBtn.onclick = function() {
            performServerDelete(city, codeToRemove);
            closeDeleteModal();
        };
    }

    function closeDeleteModal() {
        document.getElementById('deleteConfirmModal').style.display = 'none';
    }

    function performServerDelete(city, code) {
        fetch('/remove_code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ city_name: city, code: code })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // עדכון ה-UI המקומי ללא רענון עמוד
                cityData[city] = cityData[city].filter(c => c !== code);
                renderTable();
                // כאן תוכל להוסיף את פונקציית ה-Toast שלך
                showToast("הקוד הוסר בהצלחה", "success");
            } else {
                showToast(data.message, "error");
            }
        })
        .catch(err => showToast("שגיאה בתקשורת", "error"));
    }


    const cityData = {{ (existing_codes | default({})) | tojson | safe }};

    document.addEventListener('DOMContentLoaded', renderTable);

    function renderTable() {
        const tbody = document.querySelector('#summaryTable tbody');
        if (!tbody) return;
        tbody.innerHTML = '';

        Object.keys(cityData).sort().forEach(city => {
            const codes = cityData[city];
            if (!codes || codes.length === 0) return;

            const row = document.createElement('tr');

            // יצירת ה-Badges לקודים
            const codesHtml = codes.map(c => `
                <span style="background: #eef2ff; color: #2575fc; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin: 4px; display: inline-flex; align-items: center; gap: 8px;">
                    ${c}
                    <span onclick="removeCode('${city}', '${c}')" style="cursor: pointer; color: #ff4d4d; font-size: 18px; line-height: 1;">&times;</span>
                </span>
            `).join('');

            row.innerHTML = `
                <td>${city}</td>
                <td>${codesHtml}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function addEntry() {
        const city = document.getElementById('citySelect').value;
        const code = document.getElementById('codeInput').value.trim();

        if (!city || !code) {
            showToast("אנא בחר עיר והכנס קוד", "error");
            return;
        }

        fetch('/add_code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ city_name: city, code: code })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                if (!cityData[city]) cityData[city] = [];
                if (!cityData[city].includes(code)) {
                    cityData[city].push(code);
                    renderTable();
                }
                document.getElementById('codeInput').value = '';
                showToast(data.message || "הקוד נוסף בהצלחה!", "success");
            } else {
                showToast(data.message, "error");
            }
        })
        .catch(error => showToast("תקלה בתקשורת עם השרת", "error"));
    }

    function removeCode(city, codeToRemove) {
        // 1. השגת האלמנטים של המודל
        const modal = document.getElementById('deleteConfirmModal');
        const displayElement = document.getElementById('delete-user-display-name');
        const confirmBtn = document.getElementById('confirmDeleteBtn');

        // 2. עדכון הטקסט להצגה (נציג את הקוד והעיר)
        if (displayElement) {
            displayElement.innerText = `הקוד ${codeToRemove} (${city})`;
        }

        // 3. הצגת המודל
        modal.style.display = 'flex'; // וודא שה-CSS שלך תומך ב-flex למרכוז, או השתמש ב-'block'

        // 4. הגדרת הפעולה בלחיצה על כפתור המחיקה במודל
        confirmBtn.onclick = function() {
            fetch('/remove_code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ city_name: city, code: codeToRemove })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // עדכון הנתונים מקומית
                    cityData[city] = cityData[city].filter(c => c !== codeToRemove);
                    renderTable();
                    showToast("הקוד הוסר בהצלחה", "success");
                } else {
                    showToast(data.message || "שגיאה במחיקה", "error");
                }
            })
            .catch(err => {
                console.error(err);
                showToast("תקלה בתקשורת עם השרת", "error");
            })
            .finally(() => {
                // סגירת המודל בסיום (בין אם הצליח ובין אם נכשל)
                closeDeleteModal();
            });
        };
    }

    // פונקציה לסגירת המודל
    function closeDeleteModal() {
        const modal = document.getElementById('deleteConfirmModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }
</script>
{% endblock %}
</body>
</html>
