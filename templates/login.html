<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename=logo | default('images/logo.png')) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

{% extends "base.html" %}

{% block title %}כניסה{% endblock %}

{% block content %}
<div class="login-container">
    <div class="image-login">
        <img src="{{ url_for('static', filename='images/banner.png') }}" alt="User Image" class="card-image">
        <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}" style="margin-top:70px; transform: scale(1.1);">
    </div>

    <div class="card">
        <h2>התחברות למערכת</h2>

        <form method="POST" dir="rtl">
            <label for="fname">שם מלא</label>
            <input type="name" id="fname" name="name">

            <label for="lname">סיסמה</label>
            <input type="password" id="lname" name="password"><br><br>

            <div class="checkbox-wrapper">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    זכור אותי
                </label>
            </div><br>

            <button type="submit" class="buttons-container">התחבר</button>
            <button type="button" id="sso-button" class="buttons-container">
                התחבר באמצעות SSO
            </button>

            <div id="sso-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">
                <div style="background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); direction: rtl; font-family: 'Rubik', sans-serif;">
                    <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}" style="margin-top: 25px; font-size: 50px; margin-bottom: 25px; display: inline-block; transform: scale(2.5)">
                    <h3 style="margin: 0; color: #333;">מתחבר באופן מאובטח...</h3>
                    <p style="color: #666; margin-top: 10px;">אנא המתן בזמן שאנו מאמתים את פרטיך</p>
                </div>
            </div>
        </form>

        <br>
        <p>גרסה 15.2.0/10</p>
        <p>כל הזכויות שמורות ©</p>

        <a href="javascript:void(0)" onclick="openNewUserDialog()" style="text-decoration: none; margin-right: 10px;">
            <p style="color: #2575fc; font-weight: bold;">
                 כאן יוצרים חשבון
            </p>
        </a>
    </div>

    <div id="newUserDialog" class="modal-overlay" style="display: none; direction: rtl;">
        <div class="confirm-box" style="max-width: 450px; width: 90%; text-align: right; padding: 30px;">

            <h3 style="margin-bottom: 15px; color: #2575fc; font-family: 'Rubik', sans-serif; text-align: center; font-size: 32px;">
                יצירת משתמש חדש במערכת
            </h3>

            <p style="color: #666; font-size: 1.01rem; margin-bottom: 25px; line-height: 1.5; text-align: center; font-family: 'Rubik', sans-serif;">
                מלא את כתובת המייל לצורך יצירת החשבון
            </p>

            <form action="{{ url_for('create_user') }}" method="POST">
                <div style="display: flex; flex-direction: column; gap: 20px;">

                    <div class="input-group" style="text-align: center;">
                        <input type="email" name="email" required placeholder="example@email.com"
                            style="width: 40%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Rubik', sans-serif; outline: none; text-align: center;">
                    </div>
                </div>

                <div class="confirm-buttons" style="margin-top: 30px; display: flex; justify-content: center; gap: 12px;">
                    <button type="submit" class="btn-confirm"
                        style="padding: 10px 30px; border: none; border-radius: 8px; background: #3a6b3a; color: white; font-weight: bold; cursor: pointer; font-family: 'Rubik', sans-serif;">
                        צור משתמש
                    </button>
                    <button type="button" class="btn-cancel" onclick="closeNewUserDialog()"
                        style="padding: 10px 30px; border: none; border-radius: 8px; background: #6c757d; color: white; font-weight: bold; cursor: pointer; font-family: 'Rubik', sans-serif;">
                        ביטול
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openNewUserDialog() {
        document.getElementById('newUserDialog').style.display = 'flex';
    }

    function closeNewUserDialog() {
        document.getElementById('newUserDialog').style.display = 'none';
    }

    // סגירה בלחיצה מחוץ לקופסה
    window.addEventListener('click', function(event) {
        const userModal = document.getElementById('newUserDialog');
        if (event.target === userModal) {
            closeNewUserDialog();
        }
    });

    document.getElementById('sso-button').addEventListener('click', function() {
        // הצגת הדיאלוג
        const modal = document.getElementById('sso-modal');
        modal.classList.add('active');

        // סימולציה של מעבר לדף ה-SSO אחרי 2 שניות
        // במציאות, כאן תגיע הפקודה window.location.href = "/sso_login_url";
        setTimeout(function() {
            // כאן תוכל להוסיף את הקישור האמיתי להתחברות
            // window.location.href = "{{ url_for('login') }}";
            alert("מבצע הפניה לשרת האימות...");
        }, 2000);
    });
</script>

<style>
    /* מוודא שהדיאלוג מוצג כ-flex כשהוא פעיל */
    #sso-modal.active {
        display: flex !important;
    }

    #sso-button {
        color: #2563eb;
        background-color: white;
        cursor: pointer;
        border: 1px solid #2563eb;
        border-radius: 8px;
        font-weight: bold;
        width: 100%;
        padding: 12px;
        font-size: 16px;
        font-family: 'Rubik';
        transition: all 0.3s ease;
    }

    #sso-button:hover {
        transform: translateY(-2px);
    }
</style>

{% endblock %}

</body>
</html>
